# EHRJ MADRASHA ERP — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Institution: Eliotganj Hazi Rohmatollah Jamiria Madrasha
# Domain: ehrjmadrasha.com / www.ehrjmadrasha.com

upstream ehrj_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name ehrjmadrasha.com www.ehrjmadrasha.com;

    # ACME Challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ehrjmadrasha.com www.ehrjmadrasha.com;

    # SSL Certificates (Managed via Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/ehrjmadrasha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ehrjmadrasha.com/privkey.pem;

    # SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (OWASP Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Client Request & Upload Limits
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching (Next.js static files)
    location /_next/static/ {
        alias /var/www/ehrj-app/.next/static/;
        expires 365d;
        access_log off;
    }

    # Public Uploads Direct Serving
    location /uploads/ {
        alias /var/www/ehrj-app/public/uploads/;
        expires 30d;
        access_log off;
    }

    # Main Next.js Reverse Proxy
    location / {
        proxy_pass http://ehrj_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}
