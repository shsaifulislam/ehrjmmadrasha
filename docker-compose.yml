services:
  ehrj-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ehrj-madrasha-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/prod.db
      - APP_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-${APP_URL:-http://localhost:3000}}
      - JWT_SECRET=${JWT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET}
    volumes:
      - ehrj-data:/app/data
      - ehrj-backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ehrj-data:
    driver: local
  ehrj-backups:
    driver: local
